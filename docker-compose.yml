services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-3002}:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - JWT_SECRET=${JWT_SECRET:-terminalsql_jwt_secret_key_production_32chars}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-terminalsql_master_aes256_encryption_key_32c}
      - DB_PATH=/app/data/terminalsql.db
      - ALLOWED_ORIGINS=*
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5175}
      # Corporate & Offline Environment: Bypass any proxy for local/LAN traffic
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12,*.local
      - no_proxy=localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12,*.local
    volumes:
      # Persistent host directory for SQLite database (shared with native systemd service)
      - ./backend/data:/app/data:z
    restart: unless-stopped
    networks:
      - terminalsql-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5175}:80"
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - NO_PROXY=localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12,*.local
      - no_proxy=localhost,127.0.0.1,10.0.0.0/8,192.168.0.0/16,172.16.0.0/12,*.local
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - terminalsql-net

networks:
  terminalsql-net:
    driver: bridge
